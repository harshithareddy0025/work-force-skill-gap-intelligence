<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce Skill Gap Intelligence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Bitter:wght@600&display=swap">
<style>
:root{--bg:#eceff3;--pn:#fff;--ink:#1b2430;--mut:#667485;--ln:#d6dce4;--ac:#c2410c;--bad:#c0392b;--ok:#1f8a4c;--wn:#c98a0a;--soft:#fdeee6;--bl:#2f5d8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--pn:#19202a;--ink:#e8edf3;--mut:#93a1b2;--ln:#2a3441;--ac:#fb923c;--bad:#f2766a;--ok:#4fcf86;--wn:#f0b645;--soft:#33231a;--bl:#7fb0e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--pn:#19202a;--ink:#e8edf3;--mut:#93a1b2;--ln:#2a3441;--ac:#fb923c;--bad:#f2766a;--ok:#4fcf86;--wn:#f0b645;--soft:#33231a;--bl:#7fb0e0;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Outfit",system-ui,sans-serif}
header{background:var(--pn);border-bottom:1px solid var(--ln);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{font:600 23px "Bitter",Georgia,serif;margin:0}h2{font-size:13px;margin:0 0 10px}.sub{color:var(--mut);font-size:12px}
main{max-width:1400px;margin:auto;padding:14px}.tabs,.row{display:flex;gap:6px;flex-wrap:wrap}.tabs{margin-bottom:12px}
button{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:12px}.kp{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:960px){.g{grid-template-columns:1fr}}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:480px}th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}

.bar{display:grid;grid-template-columns:130px 1fr 74px;gap:8px;align-items:center;margin:8px 0;font-size:12.5px}.bt{position:relative;height:14px;background:var(--bg);border-radius:3px}.bt i{position:absolute;left:0;top:0;height:100%;border-radius:3px}.bt u{position:absolute;top:-3px;height:20px;width:2px;background:var(--ink)}
label{display:flex;justify-content:space-between;font-size:12px;margin-top:9px}label output{font-weight:700;color:var(--ac)}input[type=range]{width:100%;accent-color:var(--ac)}

.m{margin:0 0 8px;padding:7px 10px;border-radius:8px;max-width:94%;white-space:pre-wrap;font-size:13px}.m.a{background:var(--pn);border:1px solid var(--ln)}.m.u{background:var(--ac);color:#fff;margin-left:auto}
.ask{display:flex;gap:6px;margin:8px 0}.ask input{flex:1;padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);color:var(--ink);font:inherit}
.note{background:var(--soft);border-left:3px solid var(--ac);padding:8px 10px;border-radius:0 6px 6px 0;font-size:12.5px;margin-top:10px}

</style></head><body>
<header><div><h1>Workforce Skill Gap Intelligence</h1><div class="sub">120 employees mapped against 8 projects, 10 skills, 6 months (Nov ’26 to Apr ’27) · assumed data</div></div><button id="th">Toggle theme</button></header>
<main><div class="tabs" id="tabs"></div>
<section id="t0"></section><section id="t1" hidden></section><section id="t2" hidden></section><section id="t3" hidden></section><section id="t4" hidden></section>
<div class="card"><h2>AI workforce strategist</h2><div class="chat" id="chat" aria-live="polite"></div>
<div class="ask"><input id="q" placeholder="Ask: why do we miss deadlines? · which skills are critical? · hire 3 cybersecurity, train 6 · optimize" aria-label="Ask the strategist"><button class="p" id="go">Ask</button></div>
<div class="row"><button data-q="Why do we miss deadlines with enough staff?">Why do we miss deadlines?</button><button data-q="Which skills are critical gaps?">Critical gaps</button><button data-q="Which projects are at risk?">Projects at risk</button><button data-q="Who can be moved internally?">Internal moves</button><button data-q="Optimize the plan">Optimize the plan</button></div></div></main>
<script>
const SK=["Backend","Frontend","QA Automation","Data Engineering","Cloud/DevOps","ML/AI","Cybersecurity","Business Analysis","Project Mgmt","ERP/SAP"],MN=["Nov ’26","Dec","Jan ’27","Feb","Mar","Apr"];
const CNT=[24,16,13,12,12,8,6,12,9,8],LV=[[4,3,3,3,4,3,2,3],[3,3,4,2,3,3,2],[3,3,3,2,2,2,2,2,2,2,2,1,1],[4,4,3,3,3,2,2,2,2,1,1,1],[4,3,3,3,2,2,2,2,1,1,1,1],[4,3,2,2,2,1,1,1],[4,3,2,2,1,1],[3,4,3,2,3,3,2,3,4,3,2,3],[3,4,3,3,2,4,3,3,2],[4,3,2,2,2,1,1,1]],SEC={0:[4,3,6],1:[2,0],2:[0],3:[5,0],4:[6,0],5:[3],6:[4],7:[3,9],8:[9,7],9:[7]},W=[0,.2,.5,1,1],U=.9;
const PJ=[{n:'Payments Platform Revamp',s:0,e:4,v:12,r:{0:6,4:2,6:1,2:3,8:1}},{n:'AI Recommendation Engine',s:1,e:5,v:9,r:{5:4,3:3,0:2,4:1}},{n:'Customer Data Lake',s:0,e:3,v:5,r:{3:4,4:1,6:1,0:2,7:1}},{n:'Mobile App 2.0',s:0,e:5,v:8,r:{1:6,0:4,2:3,7:1,8:1}},{n:'ERP Migration',s:2,e:5,v:7,r:{9:5,7:2,8:1,4:1,2:2}},{n:'Zero-Trust Security Programme',s:1,e:4,v:6,r:{6:3,4:2,0:1}},{n:'Analytics Dashboard Suite',s:0,e:2,v:3,r:{1:3,3:2,7:1,5:1}},{n:'Core Banking API Refresh',s:2,e:5,v:10,r:{0:6,4:1,6:1,2:2}}];
let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const EM=[];let id=1;SK.forEach((s,si)=>{for(let j=0;j<CNT[si];j++){const sl=SEC[si],sec=rnd()>.3?[sl[j%sl.length],rnd()<.35?3:2]:null;EM.push({id:'E'+String(id++).padStart(3,'0'),p:si,pl:LV[si][j%LV[si].length],sec})}});
const DEM=SK.map((_,s)=>MN.map((_,m)=>PJ.reduce((a,p)=>a+(m>=p.s&&m<=p.e&&p.r[s]?p.r[s]:0),0))),BASE=SK.map((_,s)=>EM.filter(e=>e.p==s).reduce((a,e)=>a+W[e.pl]*U,0));
const cov0=SK.map((_,s)=>MN.map((_,m)=>DEM[s][m]?Math.min(1,BASE[s]/DEM[s][m]):1)),mc=c=>Math.min(...c);
const SH=SK.map((_,s)=>s).filter(s=>mc(cov0[s])<.95),SUR=SK.map((_,s)=>s).filter(s=>BASE[s]-Math.max(...DEM[s])>1);
const CAND=EM.filter(e=>SUR.includes(e.p)&&e.sec&&SH.includes(e.sec[0])).map(e=>({e,to:e.sec[0],g:U*(e.sec[1]>=3?.8:.5),l:W[e.pl]*U,urg:mc(cov0[e.sec[0]])})).sort((a,b)=>a.urg-b.urg||b.g-a.g);
const TC=EM.filter(e=>SH.includes(e.p)&&e.pl==2).sort((a,b)=>mc(cov0[a.p])-mc(cov0[b.p]));
const $=id=>document.getElementById(id),f=(n,d=0)=>n.toLocaleString('en-IN',{maximumFractionDigits:d}),sg=(n,d=1)=>(n>=0?'+':'−')+f(Math.abs(n),d),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const S0=()=>({h:SK.map(()=>0),re:0,tr:0,con:0});let S=S0(),PS=0;
function ev(s){const sup=SK.map((_,i)=>MN.map(()=>BASE[i]));SK.forEach((_,i)=>MN.forEach((_,m)=>{if(m>=3)sup[i][m]+=s.h[i]*U;if(SH.includes(i))sup[i][m]+=s.con*U}));
CAND.slice(0,Math.ceil(s.re/100*CAND.length)).forEach(c=>MN.forEach((_,m)=>{if(m>=1){sup[c.to][m]+=c.g;sup[c.e.p][m]-=c.l}}));
TC.slice(0,s.tr).forEach(e=>MN.forEach((_,m)=>{if(m>=2)sup[e.p][m]+=.45}));
const cov=SK.map((_,i)=>MN.map((_,m)=>DEM[i][m]?Math.min(1,sup[i][m]/DEM[i][m]):1));
const pr=PJ.map(p=>{let a=0,b=0;Object.entries(p.r).forEach(([sk,fte])=>{for(let m=p.s;m<=p.e;m++){a+=fte*cov[sk][m];b+=fte}});const c=a/b,dur=p.e-p.s+1,dw=dur*(1/c-1)*.8*4.3;return{c,dw,pen:p.v*.025*dw,st:dw<2?0:dw<6?1:2}});
const cost=s.h.reduce((a,h)=>a+h*5.6,0)+CAND.slice(0,Math.ceil(s.re/100*CAND.length)).length*.15+s.tr*.4+s.con*SH.length*18,pen=pr.reduce((a,p)=>a+p.pen,0);
return{cov,pr,cost,pen,dw:pr.reduce((a,p)=>a+p.dw,0),red:pr.filter(p=>p.st==2).length,amb:pr.filter(p=>p.st==1).length,net:(ev0?ev0.pen-pen:0)*100-cost}}
let ev0=null;ev0=ev(S0());const B=ev0;const SC=['var(--ok)','var(--wn)','var(--bad)'],SN=['On track','At risk','Late'];
const cc=v=>v>=.98?'rgba(31,138,76,.35)':v>=.75?'rgba(201,138,10,.4)':'rgba(192,57,43,.5)';
function ov(){const pk=Math.max(...MN.map((_,m)=>DEM.reduce((a,d)=>a+d[m],0))),crit=SK.filter((_,s)=>mc(B.cov[s])<.75).length;$('t0').innerHTML=`<div class="k"><div class="kp"><b>${EM.length}</b><span>Employees on paper</span></div><div class="kp"><b>${f(pk)}</b><span>Peak project demand (FTE), well under headcount</span></div><div class="kp"><b style="color:var(--bad)">${crit}</b><span>Skills covering under 75% of demand</span></div><div class="kp"><b style="color:var(--bad)">${B.red+B.amb} of ${PJ.length}</b><span>Projects at risk or late</span></div><div class="kp"><b>${f(B.dw)} wks</b><span>Total projected delay</span></div><div class="kp"><b style="color:var(--bad)">₹${f(B.pen,1)} Cr</b><span>Expected delay penalty</span></div></div>
<div class="card"><h2>Skill coverage by month (supply ÷ demand)</h2><div class="tw"><table><thead><tr><th>Skill</th>${MN.map(m=>`<th style="text-align:center">${m}</th>`).join('')}</tr></thead><tbody>${SK.map((s,i)=>`<tr><td>${s}</td>${B.cov[i].map(v=>`<td class="c" style="background:${cc(v)}">${f(v*100)}%</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="note"><b>Enough people, wrong skills.</b> Total supply exceeds total demand, but ${SUR.map(i=>SK[i]).join(', ')} have surplus while ${SH.map(i=>SK[i]).join(', ')} fall short. Headcount isn’t the constraint; the skill mix is.</div></div>`}
function sg1(){const pm=MN.map((_,m)=>m);$('t1').innerHTML=`<div class="g"><div class="card"><h2>Peak-month supply vs. demand (FTE)</h2>${SK.map((s,i)=>{const pk=Math.max(...DEM[i]),mx=Math.max(...BASE,...DEM.map(d=>Math.max(...d)))*1.05,gap=pk-BASE[i];return`<div class="bar"><div>${s}</div><div class="bt"><i style="width:${BASE[i]/mx*100}%;background:${gap>0?'var(--bad)':'var(--ok)'}"></i><u style="left:${pk/mx*100}%"></u></div><b style="text-align:right;color:${gap>0?'var(--bad)':'var(--ok)'}">${gap>0?'−'+f(gap,1):'+'+f(-gap,1)}</b></div>`}).join('')}<p class="sub">Bar: effective qualified supply. Line: peak demand. Level 3–4 staff count fully, level 2 count half, level 1 count one-fifth, at 90% utilization.</p></div>
<div class="card"><h2>Who holds each skill (headcount by proficiency)</h2><div class="tw"><table><thead><tr><th>Skill</th><th>L4 expert</th><th>L3</th><th>L2</th><th>L1</th><th>Cross-skilled</th></tr></thead><tbody>${SK.map((s,i)=>{const e=EM.filter(x=>x.p==i),x=EM.filter(y=>y.sec&&y.sec[0]==i).length;return`<tr><td>${s}</td>${[4,3,2,1].map(l=>`<td>${e.filter(y=>y.pl==l).length}</td>`).join('')}<td>${x}</td></tr>`}).join('')}</tbody></table></div><div class="note">Cybersecurity and ML/AI each have only one or two experts, and they are also assigned across several projects at once, so one absence can stall a deadline.</div></div></div>`}
function pj(){const p=B.pr[PS],P=PJ[PS];$('t2').innerHTML=`<div class="card"><h2>Project delivery risk (click a row)</h2><div class="tw"><table><thead><tr><th>Project</th><th>Months</th><th>Value ₹Cr</th><th>Skill coverage</th><th>Delay (wks)</th><th>Penalty ₹Cr</th><th>Status</th></tr></thead><tbody>${PJ.map((x,i)=>`<tr class="cl ${i==PS?'sel':''}" data-i="${i}"><td>${x.n}</td><td>${MN[x.s].slice(0,3)}–${MN[x.e].slice(0,3)}</td><td>${x.v}</td><td>${f(B.pr[i].c*100)}%</td><td>${f(B.pr[i].dw,1)}</td><td>${f(B.pr[i].pen,2)}</td><td><span class="pill" style="background:${SC[B.pr[i].st]}">${SN[B.pr[i].st]}</span></td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><h2>${P.n}: skill needs vs. coverage</h2>${Object.entries(P.r).map(([s,fte])=>{let a=0;for(let m=P.s;m<=P.e;m++)a+=B.cov[s][m];a/=(P.e-P.s+1);return`<div class="bar"><div>${SK[s]} (${fte} FTE)</div><div class="bt"><i style="width:${a*100}%;background:${a>=.98?'var(--ok)':a>=.75?'var(--wn)':'var(--bad)'}"></i></div><b style="text-align:right">${f(a*100)}%</b></div>`}).join('')}</div>`;$('t2').querySelector('tbody').onclick=e=>{const r=e.target.closest('tr');if(r){PS=+r.dataset.i;pj()}}}
function tp(){$('t3').innerHTML=`<div class="g"><div class="card"><h2>Internal mobility candidates (${CAND.length})</h2><div class="tw"><table><thead><tr><th>Employee</th><th>From</th><th>To (secondary skill)</th><th>Readiness</th><th>Gain FTE</th></tr></thead><tbody>${CAND.slice(0,12).map(c=>`<tr><td>${c.e.id}</td><td>${SK[c.e.p]}</td><td>${SK[c.to]} (L${c.e.sec[1]})</td><td>${c.e.sec[1]>=3?'Ready in 1 month':'Needs coaching'}</td><td>${f(c.g,2)}</td></tr>`).join('')}</tbody></table></div><div class="note">Surplus skills (${SUR.map(i=>SK[i]).join(', ')}) can feed ${[...new Set(CAND.map(c=>SK[c.to]))].join(', ')}. None of the surplus skills holds Cloud, ML or Cybersecurity depth, so those gaps need hiring, training or contractors.</div></div>
<div class="card"><h2>Upskilling candidates: level 2 to level 3 (${TC.length})</h2><div class="tw"><table><thead><tr><th>Employee</th><th>Skill</th><th>Now</th><th>Target</th><th>Ready</th></tr></thead><tbody>${TC.slice(0,12).map(e=>`<tr><td>${e.id}</td><td>${SK[e.p]}</td><td>L2</td><td>L3</td><td>${MN[2]}</td></tr>`).join('')}</tbody></table></div><p class="sub">Each promotion adds about 0.45 FTE of qualified capacity after about two months of training.</p></div></div>`}
function sm(){const r=ev(S),pc=SC;$('t4').innerHTML=`<div class="g"><div class="card"><h2>Strategy simulator</h2><div class="g2">${SK.map((s,i)=>`<div><label for="h${i}">Hire: ${s}<output id="oh${i}"></output></label><input type="range" id="h${i}" min="0" max="6" value="${S.h[i]}"></div>`).join('')}</div><label for="re">Internal reallocation (% of candidates)<output id="ore"></output></label><input type="range" id="re" min="0" max="100" step="10" value="${S.re}"><label for="tr">Employees upskilled L2 to L3<output id="otr"></output></label><input type="range" id="tr" min="0" max="${TC.length}" value="${S.tr}"><label for="con">Contractors per shortage skill<output id="ocon"></output></label><input type="range" id="con" min="0" max="4" value="${S.con}"><div class="row" style="margin-top:12px"><button class="p" id="op">Auto-optimize</button><button id="rs">Reset</button></div><p class="sub">Hires arrive in Feb ’27 after a 3-month search. Contractors start immediately at ₹3L a month each.</p></div><div class="card" id="sr"></div></div>`;
SK.forEach((_,i)=>$('h'+i).oninput=e=>{S.h[i]=+e.target.value;rs()});['re','tr','con'].forEach(k=>$(k).oninput=e=>{S[k]=+e.target.value;rs()});$('op').onclick=()=>{opt();sm()};$('rs').onclick=()=>{S=S0();sm()};rs()}
function rs(){SK.forEach((_,i)=>$('oh'+i).textContent=S.h[i]);$('ore').textContent=S.re+'%';$('otr').textContent=S.tr;$('ocon').textContent=S.con;const r=ev(S);$('sr').innerHTML=`<h2>Projected outcome vs. no action</h2><div class="k"><div class="kp"><b style="color:${r.red+r.amb?'var(--wn)':'var(--ok)'}">${r.red+r.amb}</b><span>Projects at risk or late (now ${B.red+B.amb})</span></div><div class="kp"><b>${f(r.dw)} wks</b><span>Total delay (now ${f(B.dw)})</span></div><div class="kp"><b>₹${f(r.pen,1)} Cr</b><span>Delay penalty (now ${f(B.pen,1)})</span></div></div><div class="k"><div class="kp"><b>₹${f(r.cost,1)}L</b><span>6-month cost</span></div><div class="kp"><b style="color:${r.net>=0?'var(--ok)':'var(--bad)'}">${r.net>=0?'+':'−'}₹${f(Math.abs(r.net))}L</b><span>Net benefit</span></div></div><div class="tw"><table><thead><tr><th>Project</th><th>Delay now</th><th>Delay with plan</th><th>Status</th></tr></thead><tbody>${PJ.map((p,i)=>`<tr><td>${p.n}</td><td>${f(B.pr[i].dw,1)}</td><td>${f(r.pr[i].dw,1)}</td><td><span class="pill" style="background:${SC[r.pr[i].st]}">${SN[r.pr[i].st]}</span></td></tr>`).join('')}</tbody></table></div><p class="sub">Assumes ₹5.6L per hire over the period (₹2L fee plus 3 months’ pay), ₹0.4L per training, ₹0.15L per move, and a 2.5% value penalty per week of delay. These are assumptions to replace with real figures.</p>`}
function opt(){S=S0();for(let n=0;n<60;n++){const cur=ev(S).net,tries=[];SK.forEach((_,i)=>{if(S.h[i]<6){const t={...S,h:[...S.h]};t.h[i]++;tries.push(t)}});if(S.con<3)tries.push({...S,con:S.con+1});if(S.re<100)tries.push({...S,re:S.re+10});if(S.tr<TC.length)tries.push({...S,tr:Math.min(TC.length,S.tr+2)});let best=null,bn=cur;tries.forEach(t=>{const v=ev(t).net;if(v>bn+.5){bn=v;best=t}});if(!best)break;S=best}}
const say=(t,u)=>{const e=document.createElement('div');e.className='m '+(u?'u':'a');e.textContent=t;$('chat').appendChild(e);$('chat').scrollTop=1e9};
function tab(i){[0,1,2,3,4].forEach(k=>{$('t'+k).hidden=k!=i;$('tb'+k).className=k==i?'on':''})}
const AL=[/backend/,/frontend/,/qa|test/,/data/,/cloud|devops/,/\bml\b|\bai\b|machine/,/cyber|secur/,/business|\bba\b/,/project|\bpm\b/,/erp|sap/];
function plan(){const p=[];S.h.forEach((h,i)=>{if(h)p.push(`hire ${h} ${SK[i]}`)});if(S.re)p.push(`reallocate ${S.re}% of internal candidates`);if(S.tr)p.push(`upskill ${S.tr} staff`);if(S.con)p.push(`${S.con} contractor(s) in each shortage skill`);return p.join(', ')||'no action'}
function ask(t){t=t.trim();if(!t)return;say(t,1);const l=t.toLowerCase();let ch=false;
const hm=[...l.matchAll(/hir\w*\s+(\d+)\s+([a-z/ ]+?)(?=,|\.|$| and | train| realloc| contract)/g)];hm.forEach(m=>{const i=AL.findIndex(r=>r.test(m[2]));if(i>=0){if(!ch){S=S0();ch=true}S.h[i]=cl(+m[1],0,6)}});
